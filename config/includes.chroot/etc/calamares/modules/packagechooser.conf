# Экран выбора дополнительного ПО в установщике ApOS.
# Пользователь ставит галочки — выбранные пакеты доедут в систему.
mode: multiple
id: apos_extra_software
showLabel: true
label: "Выберите дополнительное ПО для установки"

items:
  - id: office
    name: "LibreOffice (офисный пакет)"
    description: "Работа с документами, таблицами, презентациями"
    packages: [libreoffice]
    selected: true

  - id: graphics
    name: "GIMP (редактор изображений)"
    packages: [gimp]
    selected: false

  - id: media
    name: "VLC (медиаплеер)"
    packages: [vlc]
    selected: true

  - id: wine
    name: "Wine + PlayOnLinux (запуск Windows-программ)"
    packages: [wine, wine32, wine64, winetricks, playonlinux]
    selected: true

  - id: gaming
    name: "Steam"
    packages: [steam-installer]
    selected: false

  - id: dev
    name: "Инструменты разработчика (git, build-essential, VS Code через flatpak)"
    packages: [git, build-essential, flatpak]
    selected: false
