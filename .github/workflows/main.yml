name: Build ApOS ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h

      - name: Build ISO inside real Debian bookworm container
        run: |
          docker run --rm --privileged \
            -v ${{ github.workspace }}:/build \
            -w /build \
            debian:bookworm \
            bash build.sh

      - name: Upload ISO as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApOS-iso
          path: "*.iso"
          retention-days: 14
